  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'kinball-trainer-v3';
          const URLS_TO_CACHE = [
            './',
            './Kin ball trainer.html',
            './images/20260815_152922_0000.png',
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/react@18/umd/react.production.min.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
            'https://unpkg.com/@babel/standalone/babel.min.js',
            'https://unpkg.com/lucide@latest'
          ];

          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll(URLS_TO_CACHE))
            );
          });

          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request))
            );
          });
        `;
        
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).catch((err) => {
          console.log('Erreur SW:', err);
        });
      });
    }
  </script>

    // --- COMPOSANT APPLICATION PRINCIPALE ---
    function App() {
      const [screen, setScreen] = useState('home');
      const [selectedExerciseId, setSelectedExerciseId] = useState('appel');
      const [configs, setConfigs] = useState(DEFAULT_CONFIGS);
      
      const [activeSession, setActiveSession] = useState(null);
      const [phase, setPhase] = useState('ready'); // 'countdown' | 'ready' | 'rest'
      const [signals, setSignals] = useState([]);
      const [sequenceCount, setSequenceCount] = useState(0);
      const [sessionLeft, setSessionLeft] = useState(60);
      const [restLeft, setRestLeft] = useState(0);
      const [countdownLeft, setCountdownLeft] = useState(3);
      
      const [sessionEndAt, setSessionEndAt] = useState(null);
      const [restDeadline, setRestDeadline] = useState(null);
      const [now, setNow] = useState(Date.now());

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      const handleNavigate = (targetScreen) => {
        setScreen(targetScreen);
        scrollToTop();
      };

      const speak = useCallback((text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = 1.8;
        window.speechSynthesis.speak(utterance);
      }, []);

      const stopSpeech = useCallback(() => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }, []);

      const updateCurrentConfig = (newPartial) => {
        setConfigs(prev => ({
          ...prev,
          [selectedExerciseId]: { ...prev[selectedExerciseId], ...newPartial }
        }));
      };

      const triggerSequence = useCallback((timestamp, config) => {
        const activeColorIds = config.colors && config.colors.length > 0 ? config.colors : ['BLEU', 'GRIS', 'NOIR'];
        const availableSignals = ALL_SIGNALS.filter(s => activeColorIds.includes(s.id));

        let nextSignals;
        if (config.exercise === 'double') {
          const first = Math.floor(Math.random() * availableSignals.length);
          let second = Math.floor(Math.random() * availableSignals.length);
          if (availableSignals.length > 1) {
            while (second === first) second = Math.floor(Math.random() * availableSignals.length);
          }
          nextSignals = [availableSignals[first], availableSignals[second]];
        } else {
          nextSignals = [availableSignals[Math.floor(Math.random() * availableSignals.length)]];
        }

        setSignals(nextSignals);
        setSequenceCount((v) => v + 1);
        setPhase('rest');

        // Calcul du temps de repos (fixe ou aléatoire 3-8s)
        let delaySec = config.restFixed;
        if (config.isRandomRest) {
          delaySec = Math.floor(Math.random() * (config.restMax - config.restMin + 1)) + config.restMin;
        }

        setRestLeft(delaySec);
        setRestDeadline(timestamp + delaySec * 1000);

        if (config.exercise === 'plot-sprint') speak(`Touche le plot, puis ${nextSignals[0].name}`);
        else if (config.exercise === 'double') speak(`${nextSignals[0].name} puis ${nextSignals[1].name}`);
        else speak(`Omnikin ${nextSignals[0].name}`);
      }, [speak]);

      useEffect(() => {
        if (screen !== 'training' || !sessionEndAt) return;
        const interval = setInterval(() => setNow(Date.now()), 200);
        return () => clearInterval(interval);
      }, [screen, sessionEndAt]);

      useEffect(() => {
        if (screen !== 'training' || !sessionEndAt || !activeSession) return;
        const remaining = Math.max(0, Math.ceil((sessionEndAt - now) / 1000));
        setSessionLeft(remaining);

        if (remaining <= 0) {
          handleNavigate('exercise-detail');
          return;
        }

        if (phase === 'countdown') {
          const cdRem = Math.max(0, Math.ceil((restDeadline - now) / 1000));
          setCountdownLeft(cdRem);
          if (now >= restDeadline) {
            triggerSequence(now, activeSession);
          }
        } else if (phase === 'rest' && restDeadline) {
          const restRem = Math.max(0, Math.ceil((restDeadline - now) / 1000));
          setRestLeft(restRem);
          if (now >= restDeadline) {
            triggerSequence(now, activeSession);
          }
        }
      }, [now, screen, sessionEndAt, activeSession, phase, restDeadline, triggerSequence]);

      const startTraining = () => {
        stopSpeech();
        const config = { exercise: selectedExerciseId, ...configs[selectedExerciseId] };
        const startedAt = Date.now();
        setActiveSession(config);
        setSignals([]);
        setSequenceCount(0);
        setSessionLeft(config.work);

        if (config.countdown > 0) {
          setPhase('countdown');
          setCountdownLeft(config.countdown);
          setRestDeadline(startedAt + config.countdown * 1000);
          speak(`Départ dans ${config.countdown}`);
        } else {
          setPhase('ready');
          setRestDeadline(startedAt + 1000);
        }

        setSessionEndAt(startedAt + config.work * 1000);
        setNow(startedAt);
        handleNavigate('training');
      };

      const stopTraining = () => {
        stopSpeech();
        setSessionEndAt(null);
        setActiveSession(null);
        handleNavigate('exercise-detail');
      };

      return (
        <Shell screen={screen} onNavigate={handleNavigate} onGoHome={() => handleNavigate('home')}>
          {screen === 'home' && <HomeScreen onNavigate={handleNavigate} />}
          {screen === 'home-exercises' && (
            <HomeExercisesListScreen
              onSelectExercise={(id) => { setSelectedExerciseId(id); handleNavigate('exercise-detail'); }}
              onBackHome={() => handleNavigate('home')}
            />
          )}
          {screen === 'exercise-detail' && (
            <ExerciseDetailConfigScreen
              exerciseId={selectedExerciseId}
              config={configs[selectedExerciseId]}
              onUpdateConfig={updateCurrentConfig}
              onStart={startTraining}
              onBack={() => handleNavigate('home-exercises')}
            />
          )}
          {screen === 'warmup' && <WarmupPage onBack={() => handleNavigate('home')} />}
          {screen === 'gym-exercises' && <GymExercisesPage onBack={() => handleNavigate('home')} />}
          {screen === 'about' && <AboutPage onBack={() => handleNavigate('home')} />}
          {screen === 'training' && activeSession && (
            <TrainingScreen
              exercise={activeSession.exercise}
              work={activeSession.work}
              phase={phase}
              signals={signals}
              sessionLeft={sessionLeft}
              restLeft={restLeft}
              signalCount={sequenceCount}
              countdownLeft={countdownLeft}
              onStop={stopTraining}
            />
          )}
        </Shell>
      );
    }

    // --- PAGES SOUS-MENUS ---
    function WarmupPage({ onBack }) {
      const [selectedEx, setSelectedEx] = useState(null);

      return (
        <main className="mx-auto max-w-[1000px] px-5 py-8 sm:px-8">
          <button type="button" onClick={onBack} className="flex items-center gap-2 font-mono-ui text-xs uppercase font-bold text-[var(--court-deep)] mb-6">
            <Icon name="arrow-left" size={16} /> Retour à l'accueil
          </button>
          
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-[var(--line)] pb-6">
            <div>
              <SectionLabel>Préparation physique</SectionLabel>
              <h1 className="mt-1 font-display text-3xl font-bold uppercase text-[var(--ink)]">Programme d'Échauffement</h1>
              <p className="mt-1 text-xs text-[var(--ink-soft)] max-w-lg">Clique sur un exercice pour découvrir la démonstration et les détails ciblés.</p>
            </div>
          </div>

          <div className="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            {WARMUP_EXERCISES.map((w, idx) => (
              <button
                key={w.id}
                type="button"
                onClick={() => setSelectedEx(w)}
                className="group relative flex flex-col justify-between overflow-hidden rounded-2xl border-2 border-[var(--line)] bg-[var(--chalk)] p-4 text-left shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-[var(--court)] hover:shadow-md"
              >
                <div>
                  <div className="flex items-center justify-between border-b border-[var(--line)] pb-3">
                    <span className="font-mono-ui text-xs font-bold text-[var(--court-deep)]">0{idx + 1}.</span>
                    <span className="font-mono-ui text-[10px] bg-amber-50 text-amber-800 px-2 py-0.5 rounded font-bold">{w.duration}</span>
                  </div>

                  <div className="mt-4 flex justify-center py-2 bg-[var(--paper)] rounded-xl border border-[var(--line)]">
                    <CoatiVector size="w-20 h-20" />
                  </div>

                  <h3 className="mt-3 font-display text-sm font-bold uppercase leading-snug text-[var(--ink)]">{w.title}</h3>
                </div>

                <div className="mt-4 flex items-center justify-between font-mono-ui text-[10px] font-bold uppercase text-[var(--court-deep)] border-t border-[var(--line)] pt-2.5">
                  <span>Voir le détail</span>
                  <Icon name="chevron-right" size={14} />
                </div>
              </button>
            ))}
          </div>

          {selectedEx && (
            <div className="fixed inset-x-0 bottom-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
              <div className="relative w-full max-w-lg rounded-3xl border-2 border-[var(--line)] bg-[var(--chalk)] p-6 shadow-2xl">
                <button type="button" onClick={() => setSelectedEx(null)} className="absolute top-4 right-4 text-[var(--ink)]">
                  <Icon name="x" size={20} />
                </button>
                <h3 className="font-display text-xl font-bold uppercase text-[var(--ink)]">{selectedEx.title}</h3>
                <p className="mt-2 text-xs text-[var(--ink-soft)]">{selectedEx.desc}</p>
                <button type="button" onClick={() => setSelectedEx(null)} className="mt-6 w-full rounded-2xl bg-[var(--ink)] py-3 font-display text-xs font-bold uppercase text-white">Fermer</button>
              </div>
            </div>
          )}
        </main>
      );
    }

    function GymExercisesPage({ onBack }) {
      return (
        <main className="mx-auto max-w-[1000px] px-5 py-8 sm:px-8">
          <button type="button" onClick={onBack} className="flex items-center gap-2 font-mono-ui text-xs uppercase font-bold text-[var(--court-deep)] mb-6">
            <Icon name="arrow-left" size={16} /> Retour à l'accueil
          </button>
          <SectionLabel>Terrain Officiel</SectionLabel>
          <h1 className="mt-1 font-display text-3xl font-bold uppercase text-[var(--ink)]">Exercices en Salle</h1>
          <p className="mt-2 text-xs text-[var(--ink-soft)]">Module en cours de préparation pour le travail d'équipe sur grand terrain.</p>
        </main>
      );
    }

    function AboutPage({ onBack }) {
      return (
        <main className="mx-auto max-w-[800px] px-5 py-8 sm:px-8">
          <button type="button" onClick={onBack} className="flex items-center gap-2 font-mono-ui text-xs uppercase font-bold text-[var(--court-deep)] mb-6">
            <Icon name="arrow-left" size={16} /> Retour à l'accueil
          </button>
          <SectionLabel>À propos</SectionLabel>
          <h1 className="mt-1 font-display text-3xl font-bold uppercase text-[var(--ink)]">Kin-Ball Trainer Pro</h1>
          <p className="mt-4 text-xs text-[var(--ink-soft)] leading-relaxed">
            Application conçue pour perfectionner la vitesse d'action-réaction des joueurs de Kin-Ball.
          </p>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
