  <!-- SCRIPT DU MODE HORS-LIGNE (SERVICE WORKER) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'kinball-trainer-v3';
          const URLS_TO_CACHE = [
            './',
            './Kin ball trainer.html',
            './images/20260815_152922_0000.png',
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/react@18/umd/react.production.min.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
            'https://unpkg.com/@babel/standalone/babel.min.js',
            'https://unpkg.com/lucide@latest'
          ];

          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll(URLS_TO_CACHE))
            );
          });

          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request))
            );
          });
        `;
        
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).catch((err) => {
          console.log('Erreur SW:', err);
        });
      });
    }
  </script>

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px;"></i>`;
          window.lucide.createIcons({
            attrs: { strokeWidth, fill },
            nameAttr: 'data-lucide'

          {/* CALL TO ACTION : GUIDE DES DISTANCES ET TACTIQUES */}
          <div className="mt-10 overflow-hidden rounded-3xl border-2 border-[var(--court)] bg-[var(--ink)] p-6 text-white shadow-lg relative">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-6 relative z-10">
              <div className="flex items-center gap-4">
                <CoatiVector size="w-20 h-20 sm:w-24 sm:h-24" />
                <div>
                  <span className="inline-block rounded-full bg-[var(--court)] px-2.5 py-0.5 font-mono-ui text-[10px] font-bold uppercase text-[var(--ink)] mb-2">
                    Visualisation interactive
                  </span>
                  <h3 className="font-display text-xl sm:text-2xl font-bold uppercase text-[var(--chalk)]">
                    Besoin de régler vos distances ?
                  </h3>
                  <p className="mt-1 text-xs text-[rgba(245,240,229,.7)] max-w-md">
                    Consultez le Guide des Distances pour adapter vos parcours à l'espace disponible (Maison, Jardin ou Gymnase) et optimiser vos appuis.
                  </p>
                </div>
              </div>

              <button
                type="button"
                onClick={onNavigateDemo}
                className="shrink-0 inline-flex items-center justify-center gap-2 rounded-2xl bg-[var(--court)] px-5 py-3.5 font-display text-xs font-bold uppercase text-[var(--ink)] shadow-[3px_3px_0_var(--sun)] hover:bg-[var(--sun)] hover:text-[var(--ink)] transition-all"
              >
                <Icon name="crosshair" size={18} />
                <span>Ouvrir le Guide des Distances</span>
                <Icon name="arrow-right" size={16} />
              </button>
            </div>
          </div>
        </main>
      );
    }

    // --- PAGE DÉDIÉE D'UN EXERCICE (CONFIG + DEMO) ---
    function ExerciseDetailConfigScreen({ exerciseId, config, onUpdateConfig, onStart, onBack }) {
      const ex = EXERCISES[exerciseId];
      if (!ex) return null;

      const toggleColor = (colorId) => {
        const currentColors = config.colors || ['BLEU', 'GRIS', 'NOIR'];
        if (currentColors.includes(colorId)) {
          if (currentColors.length > 1) {
            onUpdateConfig({ colors: currentColors.filter(c => c !== colorId) });
          }
        } else {
          onUpdateConfig({ colors: [...currentColors, colorId] });
        }
      };

      return (
        <main className="mx-auto max-w-[1100px] px-5 pb-20 pt-6 sm:px-8">
          <button
            type="button"
            onClick={onBack}
            className="inline-flex items-center gap-2 rounded-xl border border-[var(--line)] bg-[var(--chalk)] px-3.5 py-1.5 font-mono-ui text-xs uppercase font-bold text-[var(--ink-soft)] hover:text-[var(--ink)] mb-4"
          >
            <Icon name="arrow-left" size={15} /> Liste des exercices
          </button>

          <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[var(--line)] pb-6">
            <div>
              <SectionLabel>{ex.eyebrow}</SectionLabel>
              <h1 className="mt-1 font-display text-3xl sm:text-4xl font-bold uppercase text-[var(--ink)]">{ex.name}</h1>
              <p className="mt-1 text-xs text-[var(--ink-soft)] max-w-lg">{ex.description}</p>
            </div>
            <CoatiVector size="w-20 h-20" />
          </header>

          <div className="mt-8 grid gap-8 lg:grid-cols-12">
            {/* COLONNE GAUCHE : DÉMO ET INSTRUCTIONS */}
            <div className="space-y-6 lg:col-span-6">
              <div className="rounded-2xl border border-[var(--line)] bg-[var(--chalk)] p-5 shadow-sm">
                <SectionLabel>1. Distance & Visualisation Terrain</SectionLabel>
                
                <div className="mt-3 grid grid-cols-3 gap-2">
                  {Object.keys(DIFFICULTY_LEVELS).map((lvlKey) => {
                    const lvl = DIFFICULTY_LEVELS[lvlKey];
                    const active = (config.level || 'niveau1') === lvlKey;
                    return (
                      <button
                        key={lvlKey}
                        type="button"
                        onClick={() => onUpdateConfig({ level: lvlKey })}
                        className={`rounded-xl p-2.5 text-center transition-all ${active ? 'bg-[var(--court)] text-white shadow-md font-bold' : 'bg-[var(--paper)] text-[var(--ink-soft)] hover:bg-white'}`}
                      >
                        <p className="font-mono-ui text-[10px] uppercase">{lvl.label.split('·')[0]}</p>
                        <p className="mt-1 font-display text-xs">{lvl.distanceMeters}</p>
                      </button>
                    );
                  })}
                </div>

                <div className="mt-4">
                  <CourtAnimation exerciseId={exerciseId} difficultyLevel={config.level || 'niveau1'} />
                </div>
              </div>

              <div className="rounded-2xl border border-[var(--line)] bg-[var(--chalk)] p-5 shadow-sm">
                <SectionLabel>2. Séquence de réalisation</SectionLabel>
                <div className="mt-4 space-y-3">
                  {ex.steps.map((step, idx) => (
                    <div key={idx} className="flex items-start gap-3 border-b border-[var(--line)] pb-2.5 last:border-0 last:pb-0">
                      <span className="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-[var(--court)] font-mono-ui text-[10px] font-bold text-[var(--ink)]">
                        {idx + 1}
                      </span>
                      <div>
                        <h4 className="font-display text-xs font-bold uppercase text-[var(--ink)]">{step.title}</h4>
                        <p className="mt-0.5 text-[11px] text-[var(--ink-soft)]">{step.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* COLONNE DROITE : RÉGLAGES DU CHRONO ET OPTIONS */}
            <div className="space-y-6 lg:col-span-6">
              <div className="rounded-2xl border border-[var(--line)] bg-[var(--chalk)] p-6 shadow-sm space-y-5">
                <SectionLabel>3. Paramètres de la Séance</SectionLabel>

                {/* TEMPS DE TRAVAIL TOTAL */}
                <div>
                  <div className="flex justify-between font-mono-ui text-xs font-bold mb-1">
                    <span>Durée totale d'effort</span>
                    <span className="text-[var(--court-deep)]">{formatDuration(config.work)}</span>
                  </div>
                  <input
                    type="range"
                    min={15}
                    max={180}
                    step={5}
                    value={config.work}
                    onChange={(e) => onUpdateConfig({ work: Number(e.target.value) })}
                    className="w-full accent-[var(--court)]"
                  />
                </div>

                {/* MODE DE REPOS / FREQUENCE */}
                <div className="border-t border-[var(--line)] pt-4">
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-mono-ui text-xs font-bold">Intervalles d'appel</span>
                    <button
                      type="button"
                      onClick={() => onUpdateConfig({ isRandomRest: !config.isRandomRest })}
                      className="text-[10px] font-mono-ui font-bold px-2 py-1 rounded bg-[var(--paper)] border border-[var(--line)] text-[var(--court-deep)]"
                    >
                      {config.isRandomRest ? '🎲 Aléatoire' : '⏱️ Fixe'}
                    </button>
                  </div>

                  {config.isRandomRest ? (
                    <div className="space-y-3">
                      <div>
                        <div className="flex justify-between font-mono-ui text-[11px]">
                          <span>Repos minimum</span>
                          <strong>{config.restMin || 3}s</strong>
                        </div>
                        <input
                          type="range"
                          min={2}
                          max={10}
                          value={config.restMin || 3}
                          onChange={(e) => onUpdateConfig({ restMin: Number(e.target.value) })}
                          className="w-full accent-[var(--court)]"
                        />
                      </div>
                      <div>
                        <div className="flex justify-between font-mono-ui text-[11px]">
                          <span>Repos maximum</span>
                          <strong>{config.restMax || 8}s</strong>
                        </div>
                        <input
                          type="range"
                          min={4}
                          max={15}
                          value={config.restMax || 8}
                          onChange={(e) => onUpdateConfig({ restMax: Number(e.target.value) })}
                          className="w-full accent-[var(--court)]"
                        />
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div className="flex justify-between font-mono-ui text-[11px]">
                        <span>Repos fixe entre appels</span>
                        <strong>{config.restFixed || 4}s</strong>
                      </div>
                      <input
                        type="range"
                        min={2}
                        max={15}
                        value={config.restFixed || 4}
                        onChange={(e) => onUpdateConfig({ restFixed: Number(e.target.value) })}
                        className="w-full accent-[var(--court)]"
                      />
                    </div>
                  )}
                </div>

                {/* SÉLECTION DES COULEURS ET OPTION DOUBLON */}
                <div className="border-t border-[var(--line)] pt-4 space-y-3">
                  <span className="font-mono-ui text-xs font-bold block">Couleurs actives</span>
                  <div className="grid grid-cols-3 gap-2">
                    {ALL_SIGNALS.map((sig) => {
                      const active = (config.colors || ['BLEU', 'GRIS', 'NOIR']).includes(sig.id);
                      return (
                        <button
                          key={sig.id}
                          type="button"
                          onClick={() => toggleColor(sig.id)}
                          className={`flex items-center justify-center gap-2 p-2 rounded-xl font-mono-ui text-xs font-bold transition-all border ${active ? 'border-transparent text-white shadow-sm' : 'border-[var(--line)] bg-[var(--paper)] text-gray-400 opacity-50'}`}
                          style={{ backgroundColor: active ? sig.hex : 'transparent' }}
                        >
                          <span>{sig.name}</span>
                        </button>
                      );
                    })}
                  </div>

                  <label className="flex items-center gap-2 cursor-pointer pt-1">
                    <input
                      type="checkbox"
                      checked={config.preventConsecutiveColors ?? true}
                      onChange={(e) => onUpdateConfig({ preventConsecutiveColors: e.target.checked })}
                      className="rounded accent-[var(--court)] h-4 w-4"
                    />
                    <span className="font-mono-ui text-[11px] text-[var(--ink-soft)] font-medium">
                      Éviter la même couleur deux fois de suite
                    </span>
                  </label>
                </div>

                {/* DÉCOMPTE INITIAL */}
                <div className="border-t border-[var(--line)] pt-4">
                  <div className="flex justify-between font-mono-ui text-xs font-bold mb-1">
                    <span>Décompte de départ</span>
                    <strong>{config.countdown || 3}s</strong>
                  </div>
                  <input
                    type="range"
                    min={1}
                    max={10}
                    value={config.countdown || 3}
                    onChange={(e) => onUpdateConfig({ countdown: Number(e.target.value) })}
                    className="w-full accent-[var(--court)]"
                  />
                </div>
              </div>

              {/* BOUTON LANCER L'ENTRAÎNEMENT */}
              <button
                type="button"
                onClick={onStart}
                className="flex min-h-[64px] w-full items-center justify-between rounded-2xl bg-[var(--court)] px-6 font-display text-[20px] font-bold uppercase text-[var(--ink)] shadow-[5px_5px_0_var(--sun)] hover:-translate-y-0.5 transition-all"
              >
                <span>Démarrer l'entraînement</span>
                <Icon name="play" size={24} fill="currentColor" />
              </button>
            </div>
          </div>
        </main>
      );
    }

    // --- ECRAN D'ENTRAÎNEMENT EN COURS ---
    function TrainingScreen({ exercise, work, phase, signals, sessionLeft, restLeft, signalCount, onStop }) {
      const detail = EXERCISES[exercise];
      const progress = Math.max(0, Math.min(100, ((work - sessionLeft) / work) * 100));

      return (
        <main className="min-h-[100dvh] bg-[var(--ink)] px-5 py-6 text-[var(--chalk)] sm:px-8 lg:px-12">
          <div className="mx-auto max-w-[1120px]">
            <div className="flex items-center justify-between">
              <button type="button" onClick={onStop} className="flex items-center gap-2 font-mono-ui text-[10px] uppercase text-[rgba(245,240,229,.58)] hover:text-white">
                <Icon name="arrow-left" size={15} /> Quitter
              </button>
              <div className="font-mono-ui text-[10px] uppercase text-[var(--court)] font-bold">En cours</div>
            </div>

            <div className="mt-8 flex items-end justify-between border-b border-[rgba(245,240,229,.13)] pb-4">
              <div>
                <SectionLabel dark>{detail.name}</SectionLabel>
                <p className="mt-2 font-mono-ui text-xs text-[rgba(245,240,229,.5)]">{detail.instruction}</p>
              </div>
              <div className="font-mono-ui text-3xl font-bold">{formatDuration(sessionLeft)}</div>
            </div>

            <div className="my-12 text-center">
              {phase === 'ready' ? (
                <div className="space-y-3">
                  <div className="font-display text-5xl font-black text-[var(--chalk)]">PRÉPARE-TOI</div>
                  <div className="flex items-center justify-center gap-4 text-xs font-mono-ui text-[var(--sun)]">
                    <span>💧 Pense à boire</span>
                    <span>•</span>
                    <span>🫁 Expire sur l'effort</span>
                  </div>
                </div>
              ) : (
                <div className="inline-block rounded-3xl p-8 text-center shadow-2xl transition-all" style={{ backgroundColor: signals[0]?.hex || 'var(--court)' }}>
                  <p className="font-mono-ui text-xs uppercase text-white/80">Séquence #{signalCount}</p>
                  <h1 className="mt-2 font-display text-6xl font-black uppercase text-white">
                    {signals.map(s => s.name).join(' + ')}
                  </h1>
                </div>
              )}
              {phase === 'rest' && (
                <p className="mt-6 font-mono-ui text-sm text-[var(--sun)] font-bold">
                  Prochain appel : {restLeft}s (Replace-toi au centre !)
                </p>
              )}
            </div>

            <div className="h-2 w-full overflow-hidden rounded-full bg-white/10">
              <div className="h-full bg-[var(--court)] transition-all duration-300" style={{ width: `${progress}%` }} />
            </div>

            <div className="mt-8 text-center">
              <button type="button" onClick={onStop} className="rounded-full border border-white/20 px-6 py-2 font-mono-ui text-xs uppercase text-white/70 hover:border-red-400 hover:text-red-400 transition-colors">
                Arrêter
              </button>
            </div>
          </div>
        </main>
      );
    }

    // --- APPLICATION PRINCIPALE ---
    function App() {
      const [screen, setScreen] = useState('home');
      const [selectedExercise, setSelectedExercise] = useState('appel');
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [activeSession, setActiveSession] = useState(null);
      const [phase, setPhase] = useState('ready');
      const [signals, setSignals] = useState([]);
      const [sequenceCount, setSequenceCount] = useState(0);
      const [sessionLeft, setSessionLeft] = useState(60);
      const [restLeft, setRestLeft] = useState(0);
      const [sessionEndAt, setSessionEndAt] = useState(null);
      const [nextSignalAt, setNextSignalAt] = useState(null);
      const [restDeadline, setRestDeadline] = useState(null);
      const [now, setNow] = useState(Date.now());
      const lastSignalRef = useRef(null);

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleNavigate = (targetScreen) => {
        setScreen(targetScreen);
        scrollToTop();
      };

      const speak = useCallback((text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = 1.8;
        window.speechSynthesis.speak(utterance);
      }, []);

      const stopSpeech = useCallback(() => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }, []);

      const getActiveSignalsList = useCallback((config) => {
        const allowedIds = config.colors || ['BLEU', 'GRIS', 'NOIR'];
        return ALL_SIGNALS.filter(s => allowedIds.includes(s.id));
      }, []);

      const triggerSequence = useCallback((timestamp, config) => {
        const availableSignals = getActiveSignalsList(config);
        if (availableSignals.length === 0) return;

        let nextSignals;
        if (config.exercise === 'double' && availableSignals.length > 1) {
          const first = Math.floor(Math.random() * availableSignals.length);
          let second = Math.floor(Math.random() * availableSignals.length);
          while (second === first) second = Math.floor(Math.random() * availableSignals.length);
          nextSignals = [availableSignals[first], availableSignals[second]];
        } else {
          let chosen;
          const preventConsecutive = config.preventConsecutiveColors ?? true;
          if (preventConsecutive && lastSignalRef.current && availableSignals.length > 1) {
            const filtered = availableSignals.filter(s => s.id !== lastSignalRef.current.id);
            chosen = filtered[Math.floor(Math.random() * filtered.length)];
          } else {
            chosen = availableSignals[Math.floor(Math.random() * availableSignals.length)];
          }
          lastSignalRef.current = chosen;
          nextSignals = [chosen];
        }

        let calculatedRest = config.restFixed || 4;
        if (config.isRandomRest && config.restMin && config.restMax) {
          calculatedRest = Math.floor(Math.random() * (config.restMax - config.restMin + 1)) + config.restMin;
        }

        setSignals(nextSignals);
        setSequenceCount((v) => v + 1);
        setPhase('rest');
        setRestLeft(calculatedRest);
        setRestDeadline(timestamp + calculatedRest * 1000);

        if (config.exercise === 'plot-sprint') speak(`Touche le plot, puis ${nextSignals[0].name}`);
        else if (config.exercise === 'double' && nextSignals[1]) speak(`${nextSignals[0].name} puis ${nextSignals[1].name}`);
        else speak(`Omnikin ${nextSignals[0].name}`);
      }, [speak, getActiveSignalsList]);

      useEffect(() => {
        if (screen !== 'training' || !sessionEndAt) return;
        const interval = setInterval(() => setNow(Date.now()), 200);
        return () => clearInterval(interval);
      }, [screen, sessionEndAt]);

      useEffect(() => {
        if (screen !== 'training' || !sessionEndAt || !activeSession) return;
        const remaining = Math.max(0, Math.ceil((sessionEndAt - now) / 1000));
        setSessionLeft(remaining);

        if (remaining <= 0) {
          handleNavigate('home-exercises');
          return;
        }

        if (phase === 'ready' && nextSignalAt && now >= nextSignalAt) {
          triggerSequence(now, activeSession);
          setNextSignalAt(null);
        } else if (phase === 'rest' && restDeadline) {
          const restRem = Math.max(0, Math.ceil((restDeadline - now) / 1000));
          setRestLeft(restRem);
          if (now >= restDeadline) triggerSequence(now, activeSession);
        }
      }, [now, screen, sessionEndAt, activeSession, phase, nextSignalAt, restDeadline, triggerSequence, stopSpeech]);

      const startTraining = () => {
        stopSpeech();
        const config = { exercise: selectedExercise, ...settings[selectedExercise] };
        const startedAt = Date.now();
        const cd = (config.countdown || 3) * 1000;
        lastSignalRef.current = null;
        setActiveSession(config);
        setSignals([]);
        setSequenceCount(0);
        setPhase('ready');
        setSessionLeft(config.work);
        setRestLeft(0);
        setSessionEndAt(startedAt + cd + config.work * 1000);
        setNextSignalAt(startedAt + cd);
        setRestDeadline(null);
        setNow(startedAt);
        handleNavigate('training');
      };

      const stopTraining = () => {
        stopSpeech();
        setSessionEndAt(null);
        setActiveSession(null);
        handleNavigate('home-exercises');
      };

      const goToHome = () => {
        stopTraining();
        handleNavigate('home');
      };

      const updateConfigForExercise = (exId, newFields) => {
        setSettings(prev => ({
          ...prev,
          [exId]: { ...prev[exId], ...newFields }
        }));
      };

      return (
        <Shell screen={screen} onNavigate={handleNavigate} onGoHome={goToHome}>
          {screen === 'home' && (
            <HomeScreen onNavigate={handleNavigate} />
          )}

          {/* ESPACE EXERCICES MAISON - LISTE DES 4 EXERCICES AVEC CTA DÉMO EN BAS */}
          {screen === 'home-exercises' && (
            <HomeExercisesListScreen
              onSelectExercise={(exId) => {
                setSelectedExercise(exId);
                handleNavigate('exercise-detail');
              }}
              onBackHome={goToHome}
              onNavigateDemo={() => handleNavigate('demo')}
            />
          )}

          {/* PAGE DÉDIÉE A UN EXERCICE MAISON */}
          {screen === 'exercise-detail' && (
            <ExerciseDetailConfigScreen
              exerciseId={selectedExercise}
              config={settings[selectedExercise]}
              onUpdateConfig={(fields) => updateConfigForExercise(selectedExercise, fields)}
              onStart={startTraining}
              onBack={() => handleNavigate('home-exercises')}
            />
          )}

          {screen === 'warmup' && (
            <WarmupPage onBack={goToHome} />
          )}

          {screen === 'gym-exercises' && (
            <GymExercisesPage onBack={goToHome} />
          )}

          {screen === 'about' && (
            <AboutPage onBack={goToHome} />
          )}

          {screen === 'demo' && (
            <DemoScreen
              exercise={selectedExercise}
              onSelectExercise={(ex) => setSelectedExercise(ex)}
              onBack={() => handleNavigate('home-exercises')}
            />
          )}

          {screen === 'training' && activeSession && (
            <TrainingScreen
              exercise={activeSession.exercise}
              work={activeSession.work}
              phase={phase}
              signals={signals}
              sessionLeft={sessionLeft}
              restLeft={restLeft}
              signalCount={sequenceCount}
              onStop={stopTraining}
            />
          )}
        </Shell>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
